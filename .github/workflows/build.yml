name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Clean Android Platform
        run: |
          mkdir -p temp_lib
          cp -r lib temp_lib/
          flutter create --platforms=android .
          cp -r temp_lib/lib .
          rm -rf temp_lib

      - name: Force Android SDK Versions (SDK 34 & MinSDK 21)
        run: |
          # تعديل minSdkVersion و compileSdkVersion إجبارياً لمنع أخطاء البناء
          find android/ -name "build.gradle*" -exec sed -i 's/minSdkVersion.*/minSdkVersion 21/g' {} +
          find android/ -name "build.gradle*" -exec sed -i 's/minSdk = .*/minSdk = 21/g' {} +
          find android/ -name "build.gradle*" -exec sed -i 's/compileSdkVersion.*/compileSdkVersion 34/g' {} +
          find android/ -name "build.gradle*" -exec sed -i 's/compileSdk = .*/compileSdk = 34/g' {} +

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
