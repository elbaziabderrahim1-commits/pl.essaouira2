name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Rebuild Project Platform Structure
        run: |
          # حفظ مجلد lib و pubspec
          mkdir -p temp_store
          cp -r lib pubspec.yaml temp_store/
          
          # إنشاء هيكل كامل ونظيف بدون تعارضات
          rm -rf android lib
          flutter create . --project-name staff_manager --org com.example --platforms android
          
          # استرجاع الكود الخاص بك
          cp -r temp_store/* .
          rm -rf temp_store

      - name: Configure Android Gradle Settings
        run: |
          # رفع minSdkVersion لـ 21 لتوافق shared_preferences
          sed -i 's/minSdkVersion.*/minSdkVersion 21/g' android/app/build.gradle
          # تفعيل الميزات الحديثة
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
